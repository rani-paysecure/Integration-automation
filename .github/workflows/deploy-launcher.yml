name: Integration QA Automation – Deploy
run-name: 'Integration QA Automation – Deploy · ${{ github.event.workflow_run.head_branch || github.ref_name }}'

# Auto-deploy on merge: after "Integration QA Automation – Tests" (typecheck, lint, framework self-tests) passes
# for a push to main, the launcher is rebuilt on the team server (/opt/apps/integration-launcher, docker compose).
# Manual re-deploy: Actions → Integration QA Automation – Deploy → Run workflow.
on:
  workflow_run:
    workflows: ['Integration QA Automation – Tests']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer merge waits for the running one instead of interrupting it.
concurrency:
  group: deploy-launcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & restart on the team server
    # Only after a green run triggered by a push to main (a merge) – never for pull requests.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Secrets are repository secrets (Settings → Secrets and variables → Actions):
    # DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS. The target is the UAT test-launcher host –
    # there is no production environment in this project.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit that passed the tests.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: SSH key and pinned host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '23.29.114.29' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Set the DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host $DEPLOY_HOST
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ServerAliveInterval 30
          CFG

      - name: Deploy to /opt/apps/integration-launcher
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'gautam' }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '23.29.114.29' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/apps/integration-launcher' }}
        run: bash deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_DIR"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
